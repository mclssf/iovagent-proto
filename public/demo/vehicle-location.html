<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>车辆实时位置</title>
    <link rel="stylesheet" href="/demo/leaflet.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f8fa;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #f7f8fa;
      }

      ::selection {
        color: #0b2857;
        background: #cfe1ff;
      }

      .page {
        width: min(100%, 1120px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px;
      }

      .topbar {
        display: flex;
        min-height: 44px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #e2e5ea;
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
        color: #111827;
        font-size: 14px;
        font-weight: 650;
      }

      .brand-mark {
        display: inline-flex;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: #172033;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      .online {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        color: #157347;
        font-size: 12px;
        font-weight: 600;
      }

      .online::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22a06b;
        box-shadow: 0 0 0 3px #d9f3e7;
        content: "";
      }

      .summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 20px;
        padding: 24px 0 18px;
      }

      .summary h1 {
        margin: 0;
        color: #101828;
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 680;
        letter-spacing: 0;
        line-height: 1.25;
      }

      .summary p {
        margin: 7px 0 0;
        color: #5c667a;
        font-size: 13px;
        line-height: 1.7;
      }

      .updated {
        text-align: right;
        white-space: nowrap;
      }

      .updated span {
        display: block;
        margin-bottom: 3px;
        color: #7d8799;
        font-size: 11px;
      }

      .updated strong {
        color: #344054;
        font-size: 13px;
        font-weight: 620;
      }

      .map-shell {
        position: relative;
        min-height: 430px;
        overflow: hidden;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
        background: #e9edf2;
        box-shadow: 0 12px 30px -24px rgba(16, 24, 40, 0.55);
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .map-fallback {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #667085;
        text-align: center;
      }

      .map-fallback[hidden] {
        display: none;
      }

      .map-overlay {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 500;
        width: min(360px, calc(100% - 28px));
        padding: 13px 14px;
        border: 1px solid rgba(220, 225, 232, 0.96);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 14px 32px -22px rgba(16, 24, 40, 0.7);
      }

      .map-overlay-label {
        margin-bottom: 5px;
        color: #5270a3;
        font-size: 11px;
        font-weight: 650;
      }

      .map-overlay-title {
        overflow-wrap: anywhere;
        color: #172033;
        font-size: 14px;
        font-weight: 650;
        line-height: 1.55;
      }

      .map-overlay-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 8px;
        color: #556176;
        font-size: 12px;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        margin-top: 16px;
        overflow: hidden;
        border: 1px solid #e0e4e9;
        border-radius: 8px;
        background: #e0e4e9;
      }

      .detail {
        min-width: 0;
        padding: 14px 15px;
        background: #fff;
      }

      .detail dt {
        margin: 0;
        color: #7b8494;
        font-size: 11px;
        line-height: 1.4;
      }

      .detail dd {
        margin: 6px 0 0;
        overflow-wrap: anywhere;
        color: #273249;
        font-size: 13px;
        font-weight: 620;
        line-height: 1.55;
      }

      .coordinate {
        margin-top: 12px;
        color: #7b8494;
        font-size: 11px;
        line-height: 1.6;
      }

      .vehicle-map-icon {
        border: 0;
        background: transparent;
      }

      .vehicle-marker {
        display: flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 3px solid #fff;
        border-radius: 11px;
        background: #2563eb;
        box-shadow: 0 7px 18px rgba(15, 23, 42, 0.24);
        color: #fff;
        font-size: 13px;
        font-weight: 750;
      }

      .leaflet-control-attribution {
        font-size: 9px;
      }

      @media (max-width: 720px) {
        .page {
          padding: 12px;
        }

        .summary {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .updated {
          text-align: left;
        }

        .details {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 430px) {
        .map-shell {
          min-height: 500px;
        }

        .details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">大卡</span><span>车辆定位查询</span></div>
        <div class="online">定位正常</div>
      </header>

      <section class="summary" aria-labelledby="location-title">
        <div>
          <h1 id="location-title"><span id="plate">沪A12345</span> 实时位置</h1>
          <p>展示车辆最后一次有效定位，不包含订单路线和运输进度。</p>
        </div>
        <div class="updated"><span>最后定位时间</span><strong id="time">--</strong></div>
      </section>

      <section class="map-shell" aria-label="车辆实时位置地图">
        <div id="map"></div>
        <div id="map-fallback" class="map-fallback">正在加载地图底图...</div>
        <div class="map-overlay">
          <div class="map-overlay-label">当前位置 POI</div>
          <div id="poi" class="map-overlay-title">--</div>
          <div class="map-overlay-meta"><span id="direction">--</span><span id="speed">--</span></div>
        </div>
      </section>

      <dl class="details">
        <div class="detail"><dt>车辆</dt><dd id="detail-plate">--</dd></div>
        <div class="detail"><dt>定位状态</dt><dd>GPS 在线 · 信号稳定</dd></div>
        <div class="detail"><dt>航向</dt><dd id="detail-direction">--</dd></div>
        <div class="detail"><dt>当前速度</dt><dd id="detail-speed">--</dd></div>
      </dl>
      <div class="coordinate">经纬度：<span id="coordinate">--</span> · 数据为演示仿真结果</div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const numberParam = (name, fallback, min, max) => {
        const rawValue = params.get(name);
        if (rawValue === null || rawValue.trim() === "") return fallback;
        const value = Number(rawValue);
        return Number.isFinite(value) && value >= min && value <= max ? value : fallback;
      };
      const data = {
        plate: params.get("plate") || "沪A12345",
        poi: params.get("poi") || "G60 沪昆高速·嘉兴服务区东侧 2.4km",
        direction: params.get("direction") || "正东方向（88°）",
        speed: params.get("speed") || "68 km/h",
        time: params.get("time") || "--",
        lat: numberParam("lat", 30.768421, -90, 90),
        lng: numberParam("lng", 120.684295, -180, 180),
      };

      const setText = (id, value) => {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
      };

      document.title = `${data.plate} 车辆实时位置`;
      setText("plate", data.plate);
      setText("detail-plate", data.plate);
      setText("poi", data.poi);
      setText("direction", data.direction);
      setText("detail-direction", data.direction);
      setText("speed", data.speed);
      setText("detail-speed", data.speed);
      setText("time", data.time);
      setText("coordinate", `${data.lat.toFixed(6)}, ${data.lng.toFixed(6)}`);

      const fallback = document.getElementById("map-fallback");
      const safePopup = (title, lines) => {
        const root = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = title;
        root.appendChild(strong);
        lines.forEach((line) => {
          const row = document.createElement("div");
          row.textContent = line;
          root.appendChild(row);
        });
        return root;
      };

      if (window.L) {
        const map = L.map("map", { zoomControl: true }).setView([data.lat, data.lng], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: 19,
        }).addTo(map);
        const icon = L.divIcon({
          className: "vehicle-map-icon",
          html: '<div class="vehicle-marker">车</div>',
          iconSize: [38, 38],
          iconAnchor: [19, 19],
          popupAnchor: [0, -22],
        });
        L.marker([data.lat, data.lng], { icon })
          .addTo(map)
          .bindPopup(safePopup(`${data.plate} · 定位正常`, [data.poi, `${data.direction} · ${data.speed}`, `最后定位 ${data.time}`]))
          .openPopup();
        fallback.hidden = true;
      } else {
        fallback.textContent = "地图资源加载失败，请稍后刷新。车辆定位数据仍可在下方查看。";
      }
    </script>
  </body>
</html>
